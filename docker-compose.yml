version: '3.8'

services:
  roadvision-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: roadvision-ai-backend:arm64
    container_name: roadvision-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MODEL_CHECKPOINT_URL=${MODEL_CHECKPOINT_URL:-https://huggingface.co/PalakChaudhary27/roadvision-deeplabv3-resnet50/resolve/main/best_model.pth}
      - MODEL_CHECKPOINT_PATH=/models/best_model.pth
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - PORT=8000
    volumes:
      - roadvision-models:/models
      - roadvision-db:/app/backend/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G

volumes:
  roadvision-models:
    name: roadvision_models_cache
  roadvision-db:
    name: roadvision_db_data

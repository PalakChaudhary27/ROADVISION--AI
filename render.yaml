services:
  - type: web
    name: roadvision-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MODEL_CHECKPOINT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
